function toast(msg,ms=3200){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,ms)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function stripeColor(v){
  const lerp=(a,b,t)=>a.map((x,i)=>Math.round(x+(b[i]-x)*t));let c;
  if(v<0){const t=Math.min(1,-v/0.5);c=t<.5?lerp([247,251,255],[107,174,214],t*2):lerp([107,174,214],[8,69,148],(t-.5)*2)}
  else{const t=Math.min(1,v/1.25);c=t<.5?lerp([255,245,240],[251,106,74],t*2):lerp([251,106,74],[103,0,13],(t-.5)*2)}
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
async function compress(file,max=1800,q=.85){
  let bmp;
  try{bmp=await createImageBitmap(file)}catch(e){throw new Error("เปิดไฟล์รูปนี้ไม่ได้ ลองถ่ายใหม่หรือเลือกไฟล์ JPG/PNG")}
  const s=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas");c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(r,"image/jpeg",q));
}
const b64=blob=>new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(",")[1]);fr.onerror=rej;fr.readAsDataURL(blob)});

function fs(mode){
  try{
    if(document.fullscreenElement){document.exitFullscreen();return}
    document.body.dataset.fs=mode;
    const r=document.documentElement.requestFullscreen?.();
    if(!r){delete document.body.dataset.fs;toast("เบราว์เซอร์นี้เปิดเต็มจอไม่ได้");return}
    r.catch(()=>{delete document.body.dataset.fs;toast("เบราว์เซอร์นี้เปิดเต็มจอไม่ได้")});
  }catch(e){delete document.body.dataset.fs;toast("เบราว์เซอร์นี้เปิดเต็มจอไม่ได้")}
}

/* ---------------- API ---------------- */
async function call(action,data={}){
  if(!API) throw new Error("ยังไม่ได้ตั้งค่า URL ของ Apps Script ใน config.js");
  let r;
  try{r=await fetch(API,{method:"POST",body:JSON.stringify(Object.assign({action,key:S.key},data))})}
  catch(e){throw new Error("ติดต่อเซิร์ฟเวอร์ไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองอีกครั้ง")}
  let j;try{j=await r.json()}catch(e){throw new Error("เซิร์ฟเวอร์ตอบกลับไม่ถูกต้อง")}
  if(!j.ok) throw new Error(j.error||"ทำรายการไม่สำเร็จ");
  return j;
}
async function load(quiet){
  try{const j=await call("state");S.st=j.state;S.teacher=!!j.teacher;S.err=null;
    if(!S.teacher&&S.key){S.key="";try{localStorage.removeItem("cc-tk")}catch(e){}}}
  catch(e){S.err=e.message}
  S.loading=false;render(quiet);
}
setInterval(()=>{if(document.hidden||S.busy||!API) return;const r=route();
  if(S.teacher&&["groups","work","present","exit","homework"].includes(r)) load(true);
  else if(r==="work") load(true)},S.teacher?6000:15000);

function makeGroups(){
  const key=r=>r.prog+"|"+(/^นาย(?!สาว)/.test(r.name)?"m":"f");
  const strata={};roster().forEach(r=>(strata[key(r)]=strata[key(r)]||[]).push(r.id));
  const order=Object.keys(strata).sort().flatMap(k=>shuffle(strata[k]));
  const gs=Array.from({length:9},()=>[]);order.forEach((id,i)=>gs[i%9].push(id));
  return shuffle(gs).sort((a,b)=>b.length-a.length);
}

function wrapLines(g,text,maxW,maxLines){
  const seg=window.Intl?.Segmenter?new Intl.Segmenter("th",{granularity:"word"}):null;
  const parts=seg?[...seg.segment(text)].map(x=>x.segment):[...text];const lines=[];let cur="";
  for(const p of parts){const t=cur+p;if(g.measureText(t).width>maxW&&cur){lines.push(cur.trim());cur=p.trimStart()}else cur=t}
  if(cur.trim()) lines.push(cur.trim());
  if(lines.length>maxLines){const l=lines.slice(0,maxLines);l[maxLines-1]=l[maxLines-1].replace(/.{0,2}$/,"…");return {lines:l,over:true}}
  return {lines,over:false};
}
function fitText(g,text,x,y,maxW,maxH,size,weight,color,family='"IBM Plex Sans Thai"'){
  let s=size,res;
  for(;s>=18;s-=2){g.font=`${weight} ${s}px ${family}`;res=wrapLines(g,text,maxW,Math.max(1,Math.floor(maxH/(s*1.35))));if(!res.over) break}
  g.fillStyle=color;g.textBaseline="top";res.lines.forEach((l,i)=>g.fillText(l,x,y+i*s*1.35));return res.lines.length*s*1.35;
}

  const sec=Math.ceil(left);c.textContent=`${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}`;
  c.className="clock"+(T.phase!=="idle"&&left<=0?" over":left<=15&&T.phase!=="idle"?" low":"");
  $("#phase").textContent={idle:"พร้อมเริ่ม",present:"กำลังนำเสนอ",qa:"กำลังซักถาม"}[T.phase]+(T.phase!=="idle"&&left<=0?" · หมดเวลา":T.running?"":T.phase!=="idle"?" · หยุดชั่วคราว":"");
  const bar=$("#bar");bar.className="bar"+(T.phase==="qa"?" q":"");bar.firstElementChild.style.width=(T.total?100*(1-left/T.total):0)+"%";
  const b=$("#tbtns");if(b&&b.dataset.k!==T.phase+T.running){b.dataset.k=T.phase+T.running;
    b.innerHTML=`<button class="btn lg primary" data-act="t-present">เริ่มนำเสนอ</button><button class="btn lg heat" data-act="t-qa">เริ่มซักถาม</button>${T.phase!=="idle"?`<button class="btn" data-act="t-pause">${T.running?"หยุด":"ต่อ"}</button><button class="btn" data-act="t-add">+30 วิ</button><button class="btn ghost" data-act="t-reset">รีเซ็ต</button>`:""}`}
}
function tStart(phase){const sec=phase==="present"?S.dur.p:S.dur.q;S.timer={phase,total:sec,left:sec,endAt:Date.now()+sec*1000,running:true,beeped:false};wake();beep(660,120);paintTimer()}
setInterval(()=>{const T=S.timer;if(!T.running) return;const left=(T.endAt-Date.now())/1000;
  if(left<=0){T.running=false;T.left=0;if(!T.beeped){T.beeped=true;beep(880,400);setTimeout(()=>beep(660,500),450)}}
  if(route()==="present") paintTimer()},250);
async function spin(elId,ids){
  const el=$("#"+elId);if(!el||!ids.length) return null;S.busy=true;
  if(!reduced()){el.classList.add("spin");for(let k=0;k<16;k++){el.textContent=fullName(ids[Math.floor(Math.random()*ids.length)]);await sleep(60+k*8)}}
  const pick=ids[Math.floor(Math.random()*ids.length)];el.classList.remove("spin");el.textContent=fullName(pick);S.busy=false;return pick;
}
async function savePresent(data){try{await call("setPresent",{group:S.sel.present,data});load(true)}catch(e){toast(e.message,6000)}}

/* ---------------- 5 exit ---------------- */
function exitDone(e){return !!e&&[0,1,2].every(i=>["pass","partial"].includes(e.q?.[i]?.rating))}
function exitRaw(g){return structuredClone(S.st?.exitRaw?.[g]||{q:[{},{},{}]})}
function vExit(v){
  const g=S.sel.exit,T=S.teacher,pub=S.st?.exit?.[g]||{q:[]};const raw=T?exitRaw(g):null;
  v.innerHTML=stageHead("exit","บัตรออกรายกลุ่ม")+
  `<div class="present"><div class="glist">${SCEN.map((_,i)=>`<button data-eg="${i+1}" aria-current="${g===i+1}"><span>กลุ่ม ${i+1}</span>${S.st?.exit?.[i+1]?.done?`<span class="chip ok">ออกได้</span>`:""}</button>`).join("")}</div>
  <div class="stack">
   <p class="muted">สุ่มผู้ตอบทีละข้อ คนละข้อไม่ซ้ำกัน ถ้ายังไม่ผ่านให้สุ่มคนใหม่ตอบอีกครั้ง ตอบครบ 3 ข้อแล้วกลุ่มออกจากห้องได้</p>
   ${pub.done?`<div class="leave">✓ กลุ่ม ${g} ตอบครบแล้ว ออกจากห้องได้</div>`:""}
   ${EXITQ.map((Q,i)=>{const a=pub.q?.[i]||{};const r=raw?.q?.[i]||{};const done=["pass","partial"].includes(a.rating);
     return `<section class="qcard ${done?"done":""}"><div class="row"><span class="qn">ข้อ ${i+1} · ${Q.clo}</span><span class="spacer"></span>${a.tries?`<span class="chip">ตอบแล้ว ${a.tries} ครั้ง</span>`:""}${done?`<span class="chip ok">${a.rating==="pass"?"ผ่าน":"ผ่านบางส่วน"}</span>`:""}</div>
     <h3 style="font-size:20px">${h(Q.q)}</h3>
     <div class="row"><span class="eyebrow">ผู้ตอบ</span><span class="picked" id="ea${i}" style="font-size:24px">${h(pname(a.answerer))}</span><span class="spacer"></span>${T&&!done?`<button class="btn heat" data-act="exit-spin" data-q="${i}" ${idsOf(g).length?"":"disabled"}>${r.answerer?"สุ่มคนใหม่":"สุ่มผู้ตอบ"}</button>`:""}</div>
     ${T&&r.answerer?`<div class="rate">${[["pass","ok","ผ่าน"],["partial","warn","ผ่านบางส่วน"],["fail","bad","ยังไม่ผ่าน"]].map(([k,c,t])=>`<button class="${c}" data-act="exit-rate" data-q="${i}" data-r="${k}" aria-pressed="${r.rating===k}">${t}</button>`).join("")}</div>
     <input type="text" id="en${i}" value="${h(r.note||"")}" placeholder="บันทึกสั้น ๆ (ไม่บังคับ)" data-note="${i}">`:""}
     ${T?`<details><summary>แนวคำตอบสำหรับอาจารย์</summary><p class="small" style="margin-top:6px">${h(Q.key)}</p></details>`:""}</section>`}).join("")}
  </div></div>`;
}
async function exitSpin(i){
  const g=S.sel.exit,e=exitRaw(g);e.q=e.q||[{},{},{}];
  const used=new Set(e.q.flatMap(a=>(a.tries||[]).map(t=>t.who)).concat(e.q.map(a=>a.answerer).filter(Boolean)));
  let pool=idsOf(g).filter(id=>!used.has(id));if(!pool.length) pool=idsOf(g);
  const pick=await spin("ea"+i,pool);if(!pick) return;
  e.q[i]=Object.assign({},e.q[i],{answerer:pick,rating:null});e.done=false;
  try{await call("setExit",{group:g,data:e});await load()}catch(x){toast(x.message,6000)}
}
async function exitRate(i,r){
  const g=S.sel.exit,e=exitRaw(g);e.q=e.q||[{},{},{}];const a=e.q[i]||{};
  a.rating=r;a.note=$("#en"+i)?.value||a.note||"";a.tries=(a.tries||[]).concat([{who:a.answerer,rating:r,at:Date.now()}]);e.q[i]=a;e.done=exitDone(e);
  try{await call("setExit",{group:g,data:e});if(e.done) beep(990,300);await load()}catch(x){toast(x.message,6000)}
}

/* ---------------- 6 homework ---------------- */
const HW_TEXT="คำนวณคาร์บอนฟุตพริ้นท์ของตนเองต่อเดือนตามตารางในสไลด์ 17 (ไฟฟ้า ก๊าซหุงต้ม ขยะ การเดินทาง) ระบุกิจกรรมที่ปล่อยก๊าซมากที่สุด และประมาณว่ามาตรการที่เลือกในบัตรออกลดได้กี่ kgCO₂e ต่อเดือน ทำลงกระดาษ A4 เขียนชื่อและรหัสนิสิตมุมขวาบน";
function vHomework(v){
  const due=S.st?.settings?.hwDue||"";
  if(!S.teacher){
    const c=S.hwCheck;
    v.innerHTML=stageHead("homework","ส่งการบ้าน")+`<div class="grid2"><div class="panel stack"><h3>การบ้าน</h3><p>${h(HW_TEXT)}</p>${due?`<span class="chip heat">กำหนดส่ง ${h(due)}</span>`:""}</div>
    <form class="panel stack" id="hwform"><label class="f">รหัสนิสิต<input type="text" id="sid" inputmode="numeric" autocomplete="off" maxlength="8" value="${h(S.hwId)}" placeholder="เช่น 69140011" required></label>
      <div class="row"><button class="btn" type="button" data-act="hw-check">ตรวจสอบรหัส</button>${c?`<span class="chip ${c.submitted?"ok":"warn"}">${h(c.name)} · ${c.submitted?`ส่งแล้ว ${h(fmtTime(c.at))} (${c.pages} หน้า)`:"ยังไม่ส่ง"}</span>`:""}</div>
      <label class="f">รูปการบ้าน (สูงสุด 3 หน้า)<input type="file" id="hwfile" accept="image/*" multiple></label>
      <div class="pages" id="hwprev"></div>
      <button class="btn lg heat" type="submit">ส่งการบ้าน</button>
      <p class="small muted">ส่งใหม่ได้ ระบบจะใช้ไฟล์ชุดล่าสุด ถ่ายให้เห็นกระดาษทั้งแผ่นในที่สว่าง</p></form></div>`;
    return;
  }
  const hw=S.st?.homework||{};const list=roster();const n=Object.keys(hw).length;const gOf={};(S.st?.groupIds||[]).forEach((m,i)=>m.forEach(id=>gOf[id]=i+1));
  v.innerHTML=stageHead("homework","ส่งการบ้าน",`<a class="btn" href="${SHEET_URL}" target="_blank" rel="noopener">เปิดตารางบันทึก</a>`)+
  `<div class="stack"><div class="grid2"><div class="panel stack"><h3>โจทย์การบ้าน</h3><p>${h(HW_TEXT)}</p>
     <form class="row" id="dueform"><label class="f" style="flex:1">กำหนดส่ง (แสดงให้นิสิตเห็น)<input type="text" id="hwdue" value="${h(due)}" placeholder="เช่น ก่อนเริ่มคาบสัปดาห์ที่ 8"></label><button class="btn" type="submit" style="align-self:flex-end">บันทึก</button></form></div>
   <form class="panel stack" id="hwforform"><h3>ส่งแทนนิสิต</h3><p class="small muted">ใช้เมื่อนิสิตส่งรูปมาทางช่องทางอื่น</p>
     <label class="f">นิสิต<select id="hwfor" required><option value="">เลือกนิสิต</option>${list.map(r=>`<option value="${h(r.id)}">${h(r.name)} (${h(r.id)})</option>`).join("")}</select></label>
     <label class="f">รูปการบ้าน<input type="file" id="hwfilefor" accept="image/*" multiple required></label><button class="btn heat" type="submit">ส่งแทน</button></form></div>
   <div class="row"><span class="chip ${n===list.length?"ok":"warn"}">ส่งแล้ว ${n} / ${list.length} คน</span><span class="chip">ยังไม่ส่ง ${list.length-n} คน</span></div>
   <div class="panel tablewrap"><table><thead><tr><th>#</th><th>รหัส</th><th>ชื่อ-สกุล</th><th>กลุ่ม</th><th>ส่งเมื่อ</th><th>ไฟล์</th></tr></thead><tbody>
   ${list.map((r,i)=>{const x=hw[r.id];return `<tr><td class="mono">${i+1}</td><td class="mono">${h(r.id)}</td><td>${h(r.name)}</td><td class="mono">${gOf[r.id]||"-"}</td>
     <td class="small">${x?h(fmtTime(x.at))+(x.by==="teacher"?" · ส่งแทน":""):`<span class="chip">ยังไม่ส่ง</span>`}</td>
     <td class="small">${x?x.files.map((id,k)=>`<a href="${fileUrl(id)}" target="_blank" rel="noopener">หน้า ${k+1}</a>`).join(" · "):""}</td></tr>`}).join("")}
   </tbody></table></div></div>`;
}
async function hwSubmit(files,sid,byTeacher){
  sid=String(sid||"").trim();if(!/^\d{8}$/.test(sid)) return toast("รหัสนิสิตต้องเป็นตัวเลข 8 หลัก",5000);
  files=[...(files||[])].slice(0,3);if(!files.length) return toast("ยังไม่ได้เลือกรูป",4000);
  S.busy=true;
  try{toast("กำลังส่งการบ้าน…",60000);const images=[];for(const f of files){const b=await compress(f,2000,.85);images.push({mime:"image/jpeg",data:await b64(b)})}
    const j=await call("submitHomework",{studentId:sid,images,by:byTeacher?"teacher":"student"});
    if(!byTeacher){S.hwId=sid;try{localStorage.setItem("cc-sid",sid)}catch(e){}S.hwCheck={name:j.name,submitted:true,at:Date.now(),pages:j.pages}}
    toast(`ส่งการบ้านของ ${j.name} แล้ว (${j.pages} หน้า)`,5000);
  }catch(e){toast(e.message,7000)}finally{S.busy=false;S.teacher?load():render()}
}

/* ---------------- events ---------------- */
document.addEventListener("click",async ev=>{
  const t=ev.target.closest("[data-go],[data-act],[data-slide],[data-wg],[data-pg],[data-eg]");if(!t) return;
  if(t.dataset.go){if(t.dataset.go==="home"){history.replaceState(null,"",location.pathname+location.search);render()}else location.hash=t.dataset.go;return}
  if(t.dataset.slide){S.sel.slide=+t.dataset.slide;return render()}
  if(t.dataset.wg){S.sel.work=+t.dataset.wg;S.edit=null;return render()}
  if(t.dataset.pg){S.sel.present=+t.dataset.pg;return render()}
  if(t.dataset.eg){S.sel.exit=+t.dataset.eg;return render()}
  const a=t.dataset.act,g=S.sel.present;
  switch(a){
    case "login":$("#login").hidden=false;$("#tkey").focus();return;
    case "logout":S.key="";S.teacher=false;try{localStorage.removeItem("cc-tk")}catch(e){}return load();
    case "reload":S.loading=true;render();return load();
    case "groups-shuffle":return doShuffle();
    case "groups-lock":return lockGroups();
    case "groups-unlock":S.confirmUnlock=true;return render();
    case "groups-unlock-no":S.confirmUnlock=false;return render();
    case "groups-unlock-yes":S.confirmUnlock=false;S.draft=S.st?.groupIds||null;try{await call("unlockGroups")}catch(e){toast(e.message,6000)}return load();
    case "slide-prev":S.sel.slide=Math.max(0,S.sel.slide-1);return render();
    case "slide-next":S.sel.slide=Math.min(MOCK.length-1,S.sel.slide+1);return render();
    case "slide-fs":return fs("slides");
    case "slides-mock":try{await call("clearSlides")}catch(e){toast(e.message,6000)}return load();
    case "work-edit":S.edit=S.edit?null:structuredClone(W(S.sel.work).ex||blankEx());while(S.edit&&S.edit.chain.length<5) S.edit.chain.push("");return render();
    case "ch-add":readEditor();S.edit.chain.push("");return renderEditor();
    case "ch-del":readEditor();S.edit.chain.pop();return renderEditor();
    case "work-make":return makeAndSend();
    case "spin-presenter":{const pick=await spin("pp",idsOf(g));if(pick) await savePresent({presenter:pick});return}
    case "spin-asker":{const pick=await spin("pa",idsOf(askerOf(g)));if(pick) await savePresent({asker:pick,askerGroup:askerOf(g),pattern:patternOf(askerOf(g))});return}
    case "present-done":return savePresent({done:true});
    case "present-undone":return savePresent({done:false});
    case "present-next":S.sel.present=Math.min(9,g+1);S.timer={phase:"idle",total:0,left:0,endAt:0,running:false};return render();
    case "present-fs":return fs("present");
    case "t-present":return tStart("present");
    case "t-qa":return tStart("qa");
    case "t-pause":{const T=S.timer;if(T.running){T.left=Math.max(0,(T.endAt-Date.now())/1000);T.running=false}else{T.endAt=Date.now()+T.left*1000;T.running=T.left>0}return paintTimer()}
    case "t-add":{const T=S.timer;if(T.running) T.endAt+=30000;else{T.left+=30;T.endAt=Date.now()+T.left*1000;T.running=true;T.beeped=false}T.total+=30;return paintTimer()}
    case "t-reset":S.timer={phase:"idle",total:0,left:0,endAt:0,running:false};return paintTimer();
    case "exit-spin":return exitSpin(+t.dataset.q);
    case "exit-rate":return exitRate(+t.dataset.q,t.dataset.r);
    case "hw-check":{const sid=$("#sid")?.value.trim();if(!/^\d{8}$/.test(sid||"")) return toast("รหัสนิสิตต้องเป็นตัวเลข 8 หลัก",5000);
      try{S.hwId=sid;S.hwCheck=await call("checkHomework",{studentId:sid});try{localStorage.setItem("cc-sid",sid)}catch(e){}render()}catch(e){S.hwCheck=null;toast(e.message,6000)}return}
  }
});
document.addEventListener("submit",async ev=>{
  ev.preventDefault();const f=ev.target;
  if(f.id==="loginform"){const k=$("#tkey").value;S.key=k;try{const j=await call("checkKey");if(!j.ok) throw new Error()}catch(e){S.key="";return toast("รหัสอาจารย์ไม่ถูกต้อง",4000)}
    try{localStorage.setItem("cc-tk",k)}catch(e){}$("#login").hidden=true;$("#tkey").value="";toast("เข้าสู่โหมดอาจารย์แล้ว");return load()}
  if(f.id==="linkform"){const l=$("#slidelink").value.trim();if(!l) return;try{toast("กำลังตั้งค่าไฟล์สไลด์…",8000);await call("setSlidesLink",{link:l});toast("ใช้ไฟล์สไลด์นี้แล้ว")}catch(e){toast(e.message,6000)}return load()}
  if(f.id==="hwform") return hwSubmit($("#hwfile").files,$("#sid").value,false);
  if(f.id==="hwforform") return hwSubmit($("#hwfilefor").files,$("#hwfor").value,true);
  if(f.id==="dueform"){try{await call("setSettings",{data:{hwDue:$("#hwdue").value}});toast("บันทึกกำหนดส่งแล้ว")}catch(e){toast(e.message,6000)}return load()}
});
$("#logincancel").addEventListener("click",()=>{$("#login").hidden=true});
document.addEventListener("change",async ev=>{
  const t=ev.target;
  if(t.id==="slidefile"&&t.files[0]) return uploadSlides(t.files[0]);
  if(t.id==="photofile"&&t.files[0]){try{const b=await compress(t.files[0]);sendWork("photo",b,"image/jpeg")}catch(e){toast(e.message,6000)}return}
  if(t.id==="slideimg"&&t.files[0]){try{const b=await compress(t.files[0],2400,.9);sendWork("slide",b,"image/jpeg",{source:"upload"})}catch(e){toast(e.message,6000)}return}
  if(t.id==="hwfile"){const p=$("#hwprev");if(p) p.innerHTML=[...t.files].slice(0,3).map((f,k)=>`<img src="${URL.createObjectURL(f)}" alt="หน้า ${k+1}">`).join("");return}
  if(t.id==="durp") S.dur.p=Math.max(30,+t.value||120);
  if(t.id==="durq") S.dur.q=Math.max(30,+t.value||60);
  if(t.dataset.note!=null){const i=+t.dataset.note,g=S.sel.exit,e=exitRaw(g);e.q=e.q||[{},{},{}];e.q[i]=Object.assign({},e.q[i],{note:t.value});try{await call("setExit",{group:g,data:e})}catch(x){toast(x.message,6000)}}
});
document.addEventListener("input",ev=>{if(!ev.target.closest("#editor")) return;readEditor();
  if(/^(cq|cef|cr)$/.test(ev.target.id)){const e=S.edit,s=SCEN[S.sel.work-1],q=parseFloat(e.calc.quantity),f=parseFloat(e.calc.ef||s.efv),n=$("#calcnote");if(n&&isFinite(q)&&isFinite(f)) n.textContent=`ตรวจ: ${q} × ${f} = ${(q*f).toFixed(2)} kgCO₂e`}});
document.addEventListener("keydown",ev=>{if(route()!=="slides"||S.st?.slides||/INPUT|TEXTAREA|SELECT/.test(ev.target.tagName)) return;
  if(ev.key==="ArrowRight"||ev.key==="PageDown"){S.sel.slide=Math.min(MOCK.length-1,S.sel.slide+1);render()}
  if(ev.key==="ArrowLeft"||ev.key==="PageUp"){S.sel.slide=Math.max(0,S.sel.slide-1);render()}});
addEventListener("hashchange",()=>{S.edit=null;render();scrollTo(0,0)});

/* ---------------- boot ---------------- */
renderStripes();render();if(API) load();
})();
</script>
</body>
